# SonarCloud, set up as https://github.com/DEFRA/cdp-documentation/blob/main/how-to/sonarcloud.md describes.
# The scan runs in .github/workflows/check-pull-request.yml, publish.yml and publish-hotfix.yml.
# It needs the SonarCloud project DEFRA_waste-disposal-fee-frontend, and a SONAR_TOKEN repository secret.

sonar.projectKey=DEFRA_waste-disposal-fee-frontend
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/waste-disposal-fee-frontend
sonar.links.ci=https://github.com/DEFRA/waste-disposal-fee-frontend/actions
sonar.links.scm=https://github.com/DEFRA/waste-disposal-fee-frontend
sonar.links.issue=https://github.com/DEFRA/waste-disposal-fee-frontend/issues

sonar.sources=src/
sonar.exclusions=src/**/*.test.js
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

sonar.cpd.exclusions=src/**/*.test.js
