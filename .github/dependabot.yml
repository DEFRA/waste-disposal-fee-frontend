version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group minor and patch updates into shared PRs. Major updates get their own PR.
    groups:
      hapi:
        applies-to: version-updates
        patterns:
          - '@hapi/*'
        update-types:
          - 'minor'
          - 'patch'

      defra:
        applies-to: version-updates
        patterns:
          - '@defra/*'
        exclude-patterns:
          - '@defra/hapi-connect'
        update-types:
          - 'minor'
          - 'patch'

      build:
        applies-to: version-updates
        patterns:
          - '@babel/*'
          - 'vite'
          - 'sass-*'
          - 'cssnano'
          - 'cssnano-*'
        update-types:
          - 'minor'
          - 'patch'

      lint:
        applies-to: version-updates
        patterns:
          - 'prettier'
          - 'neostandard'
          - 'stylelint'
          - 'stylelint-*'
        update-types:
          - 'minor'
          - 'patch'

      logging:
        applies-to: version-updates
        patterns:
          - '*-pino'
          - '*-pino-format'
          - 'pino'
          - 'pino-*'
        update-types:
          - 'minor'
          - 'patch'

      testing:
        applies-to: version-updates
        patterns:
          - 'vitest'
          - 'vitest-*'
          - '@vitest/*'
          - 'cheerio'
          - '@defra/hapi-connect'
        update-types:
          - 'minor'
          - 'patch'

      tools:
        applies-to: version-updates
        patterns:
          - 'husky'
          - 'nodemon'
          - 'npm-run-all'
          - 'lodash'
        update-types:
          - 'minor'
          - 'patch'

    ignore:
      - dependency-name: 'eslint-*'
      - dependency-name: 'eslint'

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    groups:
      github-actions:
        patterns:
          - '*'

  # Not the Dockerfile: its Node.js base image version must change together with .nvmrc
